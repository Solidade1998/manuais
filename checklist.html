<html lang="pt-BR">
<head>

<title>Checklist MHC80</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Folha de campo: papel claro legível no sol, amarelo de máquina como acento, estado por cor semântica */
  --bg:#ECEEE9; --paper:#FFFFFF; --ink:#1B2023; --muted:#5A6367; --line:#D2D7D1;
  --accent:#F2B705; --accent-soft:#FFF3C4;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --nok:#C0321C; --nok-soft:#FBE7E3; --na:#5F6670; --na-soft:#ECEEF0; --warn:#9A6400;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#app{max-width:680px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;margin:0 -16px 16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .back{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 8px 4px 0}
.top .ttl{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl b{color:var(--accent)}
.sync{font-size:12px;color:#C9CED1;white-space:nowrap}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#8A9196;margin-right:6px;vertical-align:1px}
.sync.cloud::before{background:#3FBF7A}.sync.busy::before{background:var(--accent)}.sync.off::before{background:#E0663F}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.2px}
h2{font-size:24px}
h3{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:600;background:var(--ink);color:#fff;min-height:46px}
.btn.alt{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.btn.y{background:var(--accent);color:var(--ink)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--nok)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
/* home */
.ask{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:18px}
.ask label{display:block;font-family:var(--display);font-weight:700;font-size:28px;margin-bottom:12px}
.mhcin{display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.mhcin span{font-family:var(--display);font-weight:700;font-size:26px;padding:8px 4px 8px 12px;background:#fff}
.mhcin input{border:0;outline:0;font-family:var(--display);font-weight:700;font-size:26px;width:100%;min-width:0;padding:8px 6px}
.mhcin button{border:0;background:var(--accent);font-weight:700;padding:0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600}
.chip.on{background:var(--ink);color:#fff}
/* category cards */
.catcard{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.catcard .nm{font-family:var(--display);font-weight:700;font-size:22px}
.catcard[disabled]{opacity:.55;cursor:default}
.bar{height:6px;background:var(--na-soft);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.4px}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-nok{background:var(--nok-soft);color:var(--nok)}.p-na{background:var(--na-soft);color:var(--na)}.p-open{background:var(--accent-soft);color:var(--warn)}
/* form */
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld textarea{border:1.5px solid var(--line);border-radius:8px;padding:10px;background:#fff;font:inherit;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--ink);outline:0}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:11px 4px;font-weight:600}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
/* wizard */
.prog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.prog .bar{flex:1;height:8px}
.cond{background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.4px;text-transform:uppercase}
.cond.lig{background:var(--nok)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task .hd{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px dashed var(--line)}
.task .sq{font-family:var(--display);font-weight:700;font-size:30px;white-space:nowrap;line-height:1;min-width:44px;text-align:center;background:var(--accent);border-radius:8px;padding:6px 4px}
.task .meta{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.task .atv{font-size:19px;font-weight:600;line-height:1.3;margin-top:2px}
.task .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.task .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.answers{display:grid;grid-template-columns:1fr;gap:10px}
.ans{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:14px;font-size:19px;font-weight:700;text-align:left;min-height:60px}
.ans .bx{width:28px;height:28px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:18px;flex:none}
.ans.ok{color:var(--ok);border-color:var(--ok)}.ans.nok{color:var(--nok);border-color:var(--nok)}.ans.na{color:var(--na);border-color:#A9AFB5}
.ans.sel.ok{background:var(--ok-soft)}.ans.sel.nok{background:var(--nok-soft)}.ans.sel.na{background:var(--na-soft)}
.pp-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:0;border-top:1px solid var(--line);padding:12px 14px}
.pp-row:first-child{border-top:0}
.pp-row .sq{font-family:var(--display);font-weight:700;font-size:26px;min-width:52px;text-align:center;line-height:1.1}
.pp-row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pp-row .res{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.3px}
.pp-row .res.ok{color:var(--ok)}.pp-row .res.nok{color:var(--nok)}.pp-row .res.na{color:var(--na)}.pp-row .res.out{color:#9AA1A6;font-size:15px}
.pp-row.done{background:var(--ok-soft)}
.pp-row.done .res::after{content:"  ✓ passado";font-size:13px;color:var(--ok)}
.pp-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pp-tabs .chip{white-space:nowrap}
.pp-reg{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:2px solid var(--nok);border-radius:10px;padding:12px;text-align:left;width:100%}
.pp-reg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:16px}
.pp-reg dt{font-weight:700;color:var(--muted);font-size:13px;text-transform:uppercase;padding-top:2px}
.pp-reg dd{margin:0}
.pp-reg.done{border-color:var(--ok);background:var(--ok-soft)}
.mlist{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;min-height:56px}
.mrow:first-child{border-top:0}
.mrow .n{font-family:var(--display);font-weight:700;font-size:22px;min-width:96px}
.mrow .s{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.mrow .go{font-size:22px;color:var(--muted)}
.mrow.out{opacity:.5}
.mrow.out .n{text-decoration:line-through}
.cm{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.tagw{background:var(--accent-soft);border:2px solid var(--accent);border-radius:8px;padding:8px 10px;font-weight:700;font-size:15px}
.regcard .sq{font-family:var(--display);font-weight:700;font-size:24px;background:var(--nok);color:#fff;border-radius:6px;padding:2px 10px;white-space:nowrap}
.nokbox{border:2px solid var(--nok);background:#fff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.nokbox h3{color:var(--nok)}
.sug{display:flex;flex-direction:column;gap:6px}
.sug button{text-align:left;border:1px dashed var(--nok);background:var(--nok-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.sug b{display:block}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:22px;height:22px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.nav .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.nav .btn{flex:1;padding:10px 8px}
/* sheet */
.hdrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:14px}
.hdrgrid div span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hdrgrid div b{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#DADFD9;font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:7px 6px;font-weight:700}
td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
td.seq{font-family:var(--display);font-weight:700;font-size:19px;text-align:center;width:34px}
td.esc{font-size:12px;font-weight:700;text-align:center;width:30px;color:var(--muted)}
tr.click{cursor:pointer}
tr.click:active{background:var(--accent-soft)}
tr.out td{color:#9AA1A6}
.sub{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.rbox{display:flex;flex-direction:column;gap:2px;font-size:13px;white-space:nowrap;width:96px}
.rbox span{padding:1px 4px;border-radius:4px;color:#9AA1A6}
.rbox span.x{font-weight:700}
.rbox span.x.ok{background:var(--ok-soft);color:var(--ok)}.rbox span.x.nok{background:var(--nok-soft);color:var(--nok)}.rbox span.x.na{background:var(--na-soft);color:var(--na)}
.pend{color:var(--warn);font-weight:700;font-size:13px}
.reg td{font-size:14px}
.reg tr.done td{opacity:.5}
.tick{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;background:#fff;display:grid;place-items:center;font-weight:700}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.tally div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.tally b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;font-weight:600;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(20,24,26,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:90%}
textarea.copy{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:12px}
@media (prefers-reduced-motion:no-preference){.ans,.btn,.chip{transition:background .12s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== FOLHAS (transcritas das fotos) ===================== */
const SEG3 = (bloq) => [
  ['1','SEGURANÇA','Freio manual','APLICAR FREIO MANUAL.','Freio manual acionado e volante travado.','D'],
  ['2','SEGURANÇA','Calço','CALÇAR RODA.','Calçar máquina de acordo com procedimento específico.','D'],
  ['3','SEGURANÇA','Bloqueio','VERIFICAR SE TODOS OS BLOQUEIOS ESTÃO APLICADOS E IDENTIFICADOS.',bloq,'D']
];
const SEG2 = () => SEG3('').slice(0,2);
const BLOQ_LOCO = 'Bloqueio no Equipamento aplicado. Bloqueio da Chave EC da Locomotiva.';
const DES = 'Motor diesel desligado', LIG = 'Motor diesel ligado';
const SAP_ESP = 'Entalhes das sapatas reconhecíveis. Sapatas sem desgastes desiguais, sem desgaste unilateral e sem fraturas que indique a substituição da sapata.';
const FOLGA_ESP = 'Folga de 5mm, ou seja, o calibre não deve ficar frouxo entre a sapata de freio e a superfície da roda, tampouco não conseguir ser inserido entre essas partes.';
const MANCAL_ESP = 'Alavancas e timoneiras de freio isentas de danos (empenos e trincas) e partes faltantes.';
const EDF = 'Empenos, danos físicos, elementos de fixação.';

const CATS = [
 { id:'mec', nome:'Mecânico', doc:'Sistema Mecânico', conds:[
  { c:DES, itens:[ ...SEG3(BLOQ_LOCO),
   ['4','Mecânico','Geral','Limpar todo o equipamento com a utilização de Ferramentas Manuais, Ar comprimido e água quando necessário. Tendo uma maior atenção para componentes elétricos.','Equipamento limpo.','D'],
   ['5','Mecânico','Motor diesel Cummins QSB4.5','Conferir nível de óleo do motor diesel','Nível do óleo deve estar entre o intervalo mínimo e máximo da vareta. Completar se necessário.','D','oleo'],
   ['6','Mecânico','Motor diesel Cummins QSB4.5','Conferir nível de líquido de arrefecimento do radiador do Motor diesel','Nível do líquido precisa estar aparente na bolha de inspeção visual.','D','arref'],
   ['7','Mecânico','Motor diesel Cummins QSB4.5','Verificar possíveis vazamentos em todo o compartimento do motor diesel','Compartimento do motor sem vazamentos. (Limpeza)','D'],
   ['8','Mecânico','Motor diesel','Inspecionar indicador de saturação do filtro de ar','Filtro limpo para o momento de funcionamento da máquina.','D'],
   ['9','Mecânico','Lubrificação','Lubrificar rolamento de rotação','Rolamento devidamente lubrificado.','D'],
   ['10','Mecânico','Correia de transferência','Inspecionar correia de transferência','Assegurar a integridade da correia sem defeitos e problemas.','D'],
   ['11','Mecânico','Correia de piso','Inspeção do poste de retenção do Suporte e do Mecanismo de acionamento manual','Manter a integridade física da correia de piso.','D','poste'],
   ['12','Mecânico','Correia do piso','Inspecionar correia/corrente de piso','Manter a integridade física da correia/corrente de piso.','D'],
   ['13','Mecânico','Correia de transferência','Inspecionar visualmente o cabo de aço que faz o içamento da correia transportadora','Garantir que esteja em boas condições gerais de uso.','S'],
   ['14','Mecânico','Correia transportadora','Tensionamento das duas correias transportadoras','Precisa estar sem folga.','S'],
   ['15','Mecânico','Lubrificação','Lubrificar polia de retorno','Polias devidamente lubrificadas.','S'],
   ['16','Mecânico','Correia de piso','Inspecionar rolamentos traseiros','Verificar nível de desgaste e elementos de fixação (parafusos, etc).','S'],
   ['17','Mecânico','Poste de retenção','Inspeção do poste de retenção do Suporte e do Mecanismo de acionamento manual','Poste de retenção inspecionado, peças em bom estado de conservação.','S','poste'],
   ['18','Mecânico','Correia do piso','Ajuste e inspeção do raspador da correia','Raspadores ajustados e sem nenhum dano.','M','raspador'],
   ['19','Mecânico','Correia do piso','Inspeção de rodas dentadas, dianteiras e traseiras',EDF,'M'],
   ['20','Mecânico','Correia de transferência','Lubrificação do rolamento da polia traseira','Polias devidamente lubrificadas.','M'],
   ['21','Mecânico','Correia de transferência','Ajuste e inspeção do raspador da correia',EDF,'M','raspador'],
   ['22','Mecânico','Correia de transferência','Rastreamento da correia','Correia sem nenhum dano aparente.','M'],
   ['23','Mecânico','Correia de transferência','Inspeção de polias e rolamentos',EDF,'M']
  ]},
  { c:LIG, itens:[ ...SEG2(),
   ['3','Mecânico','Correia de piso','Inspecionar correia da esteira de piso quanto ao funcionamento','Correia funcionando corretamente, sem nenhum dano, ruptura, rasgos ou rebites ausentes.','D'],
   ['4','Mecânico','Correia de transferência','Inspecionar correia da esteira de transferência quanto ao funcionamento','Correia funcionando corretamente, sem nenhum dano, ruptura, rasgos ou rebites ausentes.','D'],
   ['5','Mecânico','Correia de piso','Lubrificar corrente da esteira do piso','Corrente devidamente lubrificada.','D'],
   ['6','Mecânico','Esteiras','Inspecionar rolamentos traseiros','Rolamentos não gastos, sem sobreaquecimento, sem ruídos incomuns, parafusos apertados.','S'],
   ['7','Mecânico','Correia de piso','Inspeção de rodas dentadas, dianteiras e traseiras','Rodas dentadas sem rachadura, quebra ou parafusos ausentes.','M'],
   ['8','Mecânico','Correia de transferência','Ajuste e inspeção do raspador da correia de transferência','Raspador bem ajustado com a correia em funcionamento.','M','raspador'],
   ['9','Mecânico','Correia de transferência','Rastreamento da correia','Correia alinhada.','M'],
   ['10','Mecânico','Correia de transferência','Inspeção de polias e rolamentos','Rolamento e polia sem acúmulo de detritos ou rachaduras. Rolamento lubrificado.','M'],
   ['11','Mecânico','Correia de piso','Ajuste e inspeção do raspador da correia de piso','Raspador bem ajustado com a correia em funcionamento.','M','raspador']
  ]}
 ]},
 { id:'tru', nome:'Truque', doc:'Truque', conds:[
  { c:DES, itens:[ ...SEG3(BLOQ_LOCO),
   ['4','Truque','Freio – truque dianteiro','Inspecionar as sapatas de freio.',SAP_ESP,'D','sapata'],
   ['5','Truque','Freio – truque traseiro','Inspecionar visualmente as sapatas de freio.',SAP_ESP,'D','sapata'],
   ['6','Truque','Rodeiros','Inspecionar as rodas quanto a defeitos aparentes: calos, friso quebrado, descamação, trincas no aro da roda, sinais de aquecimento – Eixo 1','Conforme descrito no procedimento.','D'],
   ['7','Truque','Rodeiros','Inspecionar visualmente a pista de rolamento das rodas quanto à existência de sulcos – Eixo 2','Não ter sulcos com profundidade superior a 1/8" ou 3,2 mm.','D'],
   ['8','Truque','Rodeiros','Inspecionar as rodas quanto a defeitos aparentes: calos, friso quebrado, descamação, trincas no aro da roda, sinais de aquecimento – Eixo 3','Conforme descrito no procedimento.','D'],
   ['9','Truque','Rodeiros','Inspecionar visualmente a pista de rolamento das rodas quanto à existência de sulcos – Eixo 4','Não ter sulcos com profundidade superior a 1/8" ou 3,2 mm.','D'],
   ['10','Truque','Rodeiros','Inspecionar molas amortecedoras dos rodeiros quanto a trincas, fraturas, ausência, mola cansada e limpeza – Truque 1','Molas sem danos e limpas.','S'],

/* ---------- envio para o servidor (o admin vê os checklists da equipe) ----------
   Com o banco em tempo real (LIVE), cada resposta é enviada ~1,5 s depois de marcar.
   Se o servidor ainda estiver no armazenamento antigo (KV, 1 mil gravações/dia),

let LIVE=(()=>{ try{ return localStorage.getItem('mhc80ck.live')!=='0'; }catch(e){ return true; } })();
const SEND_MS=()=>LIVE?1500:240000;
const AUTH=(()=>{ try{ return JSON.parse(localStorage.getItem('manuais.auth')||'{}')||{}; }catch(e){ return {}; } })();
const KS='mhc80ck.sent.v1';

let DEL=(()=>{ try{ return JSON.parse(localStorage.getItem(KS+'.del')||'[]')||[]; }catch(e){ return []; } })();
let flushT=null, flushing=false, syncState='local';
const saveSent=()=>{ try{ localStorage.setItem(KS,JSON.stringify(SENT)); localStorage.setItem(KS+'.del',JSON.stringify(DEL)); }catch(e){} };
const pendingIds=()=>Object.values(S.insps).filter(i=>(i.upd||0)>(SENT[i.id]||0)).map(i=>i.id);
function setSync(s){ syncState=s; const el=document.getElementById('sync'); if(el){ el.className='sync '+({cloud:'cloud',busy:'busy',offline:'off'}[s]||''); el.textContent=syncText(); } }
function syncText(){ return ({cloud:'Enviado',busy:'Enviando…',offline:'Sem sinal · salvo no celular'}[syncState]||'Salvo no celular'); }
async function api(path,body,keepalive){
  const r=await fetch('api/'+path,{method:body?'POST':'GET',headers:Object.assign({authorization:'Bearer '+(AUTH.token||'')},body?{'content-type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store',keepalive:!!keepalive});
  const d=await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(d.error||('Erro '+r.status)); e.status=r.status; throw e; } return d;
}
function touch(insp){ insp.upd=Date.now(); saveLocal(); if(syncState==='cloud') setSync('local'); schedule(SEND_MS()); }
function touchProf(){ S.prof.upd=Date.now(); saveLocal(); }
function schedule(ms){ if(ms===0){ clearTimeout(flushT); flushT=setTimeout(flush,50); return; } if(!flushT) flushT=setTimeout(flush, ms); }
async function flush(keep){
  clearTimeout(flushT); flushT=null;
  if(flushing||!AUTH.token) return; flushing=true;
  const ids=pendingIds(); if(!ids.length&&!DEL.length){ flushing=false; setSync('cloud'); return; }
  setSync('busy'); let fail=false;
  for(const id of [...DEL]){ try{ await api('ck/delete',{id},keep); DEL=DEL.filter(x=>x!==id); delete SENT[id]; saveSent(); }catch(e){ fail=true; break; } }
  for(const id of ids){ const i=S.insps[id]; if(!i||fail) continue;
    try{ const up=i.upd; const r=await api('ck/save',Object.assign({},i,{sum:stats(i)}),keep); SENT[id]=up; saveSent();
      if(typeof r.live==='boolean' && r.live!==LIVE){ LIVE=r.live; try{ localStorage.setItem('mhc80ck.live',LIVE?'1':'0'); }catch(e){} } }
    catch(e){ fail=true; if(e.status===401||e.status===403){ setSync('local'); flushing=false; return; } } }
  flushing=false;
  if(fail){ setSync('offline'); schedule(LIVE?20000:120000); } else if(pendingIds().length){ setSync('local'); schedule(SEND_MS()); } else setSync('cloud');
}
function initCloud(){ if(pendingIds().length||DEL.length) schedule(3000); else setSync('cloud'); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&(pendingIds().length||DEL.length)) flush(true); });
window.addEventListener('online',()=>{ if(pendingIds().length||DEL.length) schedule(0); });

function stats(insp){
  const it=scoped(insp); let ok=0,nok=0,na=0,falta=0;
  it.forEach(i=>{ const a=insp.ans[i.key]; if(!a||!a.r) return; if(a.r==='ok')ok++; else if(a.r==='na')na++; else { nok++; if(!(a.falha||'').trim()) falta++; } });
  return {tot:it.length, ok, nok, na, done:ok+nok+na, falta};
}

function learned(insp,item){
  const out=[], seen=new Set();
  Object.values(S.insps).sort((a,b)=>(b.upd||0)-(a.upd||0)).forEach(o=>{
    if(o.cat!==insp.cat) return;
    const map=Object.fromEntries(itemsOf(o).map(x=>[x.key,x]));
    Object.entries(o.ans||{}).forEach(([k,a])=>{
      if(o.id===insp.id&&k===item.key) return;
      if(a.r!=='nok'||!(a.falha||'').trim()) return;
      const x=map[k]; if(!x||x.atv!==item.atv) return;
      const s={f:a.falha,a:a.acao||'',m:a.mat||''}; const sig=s.f+'|'+s.a+'|'+s.m;
      if(!seen.has(sig)){ seen.add(sig); out.push(s); }
    });
  });
  (SUG[item.sug]||[]).forEach(s=>{ const sig=s.f+'|'+s.a+'|'+s.m; if(!seen.has(sig)){ seen.add(sig); out.push(s); } });
  return out.slice(0,4);
}

}

  ['mec',/poste de reten/i,null,['242483-040.00'],true],
  ['mec',/cabo de aço/i,null,['242483-040.00'],true],
  ['hid',/filtro de respiro/i,null,['246071'],true],
  ['hid',/respiro do tanque/i,null,['246071'],false],
  ['mec',/correia\/corrente de piso|esteira de piso/i,null,['251888'],false],
  ['mec',/inspecionar correia (da esteira )?de transfer|rastreamento/i,null,['251890'],false],
  ['mec',/polias e rolamentos/i,null,['241313'],false],
  ['mec',/tensionamento/i,null,['241345'],false],
  ['hid',/tanque hidr/i,null,['H33007'],false],
  ['pne',/engates rápidos/i,null,['H33007'],false],
  ['*',/bloqueios/i,null,['A26199'],false]
];
function partsFor(cat,it){
  const txt=it.sub+' '+it.atv, out=[]; let auto=null;
  for(const [c,r1,r2,pns,a] of PART_RULES){ if(c!=='*'&&c!==cat) continue; if(!r1.test(txt)||(r2&&!r2.test(txt))) continue;
    pns.forEach(p=>{ if(!out.includes(p)) out.push(p); }); if(a&&!auto) auto=pns[0]; }
  return {list:out,auto};
}
const partTxt=pn=>{ const p=PART[pn]; return `${p.pn} - ${p.nome} (${p.qtd||1} un)${p.obs?' + '+p.obs:''}`; };
function autoPart(insp,it,a){
  const {auto}=partsFor(insp.cat,it); if(!auto) return;
  if(!(a.mat||'').trim()) a.mat=partTxt(auto);
  if(!(a.acao||'').trim()) a.acao='Trocar '+PART[auto].nome.toLowerCase();
}

/* ===================== MESMO ITEM NAS DUAS ROTAS =====================
   Não Ok num item da rota desligada vale também para o mesmo componente na rota ligada
   (e vice-versa). Pares por seq: [desligada, ligada]. */
const ROUTE_PAIRS={
  mec:[['1','1'],['2','2'],['12','3'],['10','4'],['16','6'],['19','7'],['21','8'],['22','9'],['23','10'],['18','11']],
  pne:[['1','1'],['2','2'],['3','3'],['7','6'],['5','7']]
};
function twinOf(insp,it){
  const pr=(ROUTE_PAIRS[insp.cat]||[]).find(p=>it.cond===DES?p[0]===it.seq:p[1]===it.seq); if(!pr) return null;
  const want=it.cond===DES?LIG:DES, sq=it.cond===DES?pr[1]:pr[0];
  return scoped(insp).find(i=>i.cond===want&&i.seq===sq)||null;
}
/* marca Não Ok somando falha/ação/material sem repetir; espelha na outra rota */
function setNok(insp,it,f,noMirror){
  const a=insp.ans[it.key]||{}; a.r='nok'; a.t=Date.now();
  if(f.falha){ const tx=f.falha.trim(); a.falha=(a.falha||'').trim()&&!a.falha.includes(tx)?a.falha+' / '+tx:(a.falha||tx); }
  if(f.mat){ const pn=f.mat.split(' - ')[0]; const keep=(a.mat||'').split(' / ').filter(p=>p.trim()&&!p.includes(pn)); a.mat=[...keep,f.mat].join(' / '); }
  if(f.acao&&(!(a.acao||'').trim()||/^Trocar /.test(a.acao))) a.acao=f.acao;
  if(!f.mat&&!f.mirrorOf) autoPart(insp,it,a);
  insp.ans[it.key]=a;
  if(!noMirror){ const tw=twinOf(insp,it);
    if(tw&&(insp.ans[tw.key]||{}).r!=='nok') setNok(insp,tw,{falha:`Mesma falha do seq ${it.seq} (rota ${it.cond===DES?'desligada':'ligada'})`,mirrorOf:it.key},true); }
  return a;
}

/* ===================== FROTA DO DIA =====================
   17 MHCs (padrão: só o 16 fora). Os que estão fora (outra responsabilidade, avariado, fora do comboio)
   saem da lista do dia; o checklist deles fica para outro dia. "Raspador novo" diz em
   quais o raspador da correia de transferência já foi trocado (nos outros é Não Ok). */
const FROTA=Array.from({length:17},(_,i)=>p2(i+1));
function frota(){ const f=S.prof.frota||{};
  // nov/2026: só o 16 fica fora por padrão (troca única, depois vale o que a pessoa marcar)
  if(f.v!==2) return {fora:['16'], rasp:f.rasp||['01','15']};
  return {fora:f.fora||['16'], rasp:f.rasp||['01','15']}; }
function setFrota(k,m){ const f=frota(); f[k]=f[k].includes(m)?f[k].filter(x=>x!==m):[...f[k],m].sort(); f.v=2; S.prof.frota=f; touchProf(); }

/* ===================== PREENCHER PELAS ANOTAÇÕES =====================
   Para um MHC: cria (ou completa) o checklist de cada sistema, marca Ok em tudo que
   está sem resposta e aplica os Não Ok das anotações de hoje desse MHC, do raspador
   de transferência (se não for novo) e o espelho entre as rotas. Nada é finalizado:
   você confere e finaliza. */
function quickFill(mhc,escopo){
  const today=dayKey(Date.now()), cats=noteCats();
  const tips=notesFor(mhc).filter(t=>[t.created,t.upd,...(t.comments||[]).map(c=>c.at)].some(x=>x&&dayKey(x)===today));
  const mine=noteGet(mhc); if(mine.trim()) tips.unshift({id:'local',texto:mine,by:'',comments:[]});
  const tpl=Object.values(S.insps).sort((a,b)=>(b.upd||0)-(a.upd||0))[0]||{};
  const report=[]; const loose=[];
  for(const c of cats){
    let insp=inspsFor(mhc,c.id).find(i=>!i.fim&&dayKey(i.inicio)===today);
    if(!insp){ const id=newId(); const esc=(c.esc||['D','S','M']).includes(escopo)?escopo:(c.esc||['D'])[0];
      insp={id,mhc,cat:c.id,escopo:esc,rota:'des',oficina:S.prof.oficina||tpl.oficina||'',patio:S.prof.patio||tpl.patio||'',
        mant:JSON.parse(JSON.stringify(S.prof.mant||[])),inicio:Date.now(),fim:0,ans:{},cp:{},auto:true};
      S.insps[id]=insp; }
    const items=scoped(insp), noks=[];
    const nok=(it,f)=>{ setNok(insp,it,f); noks.push(it.seq); };
    tips.forEach(t=>{ const {found,rest}=findings(t);
      found.forEach(f=>{ if(f.cat&&f.cat!==c.id) return; if(!f.cat) return; // número solto: aplicar na mão
        const k=suggestKey(items,f.seq,f.cond); const it=items.find(i=>i.key===k); if(it) nok(it,f); });
      if(c.id===cats[0].id){ rest.forEach(r=>loose.push(r.txt)); found.filter(f=>!f.cat).forEach(f=>loose.push(`${f.seq} - ${f.falha}`)); } });
    if(c.id==='mec'&&!frota().rasp.includes(mhc)){ const r=MEC_RULES[1]; const it=items.find(i=>i.cond===DES&&i.seq==='21');
      if(it) nok(it,{falha:r.falha(),acao:r.acao,mat:partTxt(r.pn)}); }
    items.forEach(it=>{ const a=insp.ans[it.key]||{}; if(!a.r){ a.r='ok'; a.t=Date.now(); insp.ans[it.key]=a; } });
    touch(insp);
    report.push({id:insp.id,cat:c.id,noks:scoped(insp).filter(i=>(insp.ans[i.key]||{}).r==='nok').map(i=>i.seq+(i.cond===LIG?' (lig.)':''))});
  }
  return {report,loose,tips:tips.length};
}

/* ===================== ANOTAÇÕES DA ABA DICAS NO CHECKLIST =====================
   Dicas cujo título/máquina citam o MHC (ex.: "MHC12", "MHC80-12", "Mhc 14") aparecem
   no checklist daquele MHC. Cada linha ou comentário vira um trecho que pode ser
   aplicado num item: marca Não Ok e coloca o texto como falha no registro de tráfego.
   Se a linha começa com um número ("5 - vazamento", "seq 13 TF: folga"), o item é sugerido. */
let NOTES=(()=>{ try{ return JSON.parse(localStorage.getItem('dicas.cache.v1')||'[]'); }catch(e){ return []; } })();
let notesAt=0;
async function loadNotes(force){
  if(!AUTH.token||(!force&&Date.now()-notesAt<60000)) return;
  notesAt=Date.now();
  try{ const r=await fetch('api/tips',{headers:{authorization:'Bearer '+AUTH.token},cache:'no-store'}); if(!r.ok) return;
    const d=await r.json(); NOTES=d.tips||[]; try{ localStorage.setItem('dicas.cache.v1',JSON.stringify(NOTES)); }catch(e){}
    if(V.v==='wiz'||V.v==='sheet') softRender(); }catch(e){}
}
function tipMhc(t){
  const s=String((t.maq||'')+' '+(t.titulo||'')).toLowerCase();
  let m=s.match(/mhc\s*-?\s*80\s*[-–\/ ]\s*(\d{1,3})/); if(m) return +m[1];
  for(const x of s.matchAll(/mhc\s*-?\s*(\d{1,3})/g)) if(+x[1]!==80) return +x[1];
  return null;
}
const notesFor=mhc=>NOTES.filter(t=>tipMhc(t)===+mhc);
/* ---------- Leitura das anotações ----------
   Cada linha é quebrada em pedaços por vírgula/ponto e vírgula. Reconhece:
   - sapatas: "eixo 3 LE", "eixo 3 LE e LD", "eixos 1, 2 LD" (eixo 1 = embaixo da cabine;
     1 e 2 = truque dianteiro, seq 4; 3 e 4 = traseiro, seq 5) — junta tudo da dica;
   - "poste de retenção LE/LD" → Mecânico 11 e 17; "raspador … transferência" → 21;
     "raspador … piso" → 18; "cabo de aço … içamento" → 13 (rota desligada; a ligada
     recebe o mesmo Não Ok pelos pares de rota);
   - "5 - texto", "seq 13 TF: texto" → item pelo número;
   - o resto fica para escolher o item na mão. */
const SIDE_RE='(?:l\\.?\\s?e|l\\.?\\s?d|lado\\s+esquerdo|lado\\s+direito|esquerdo|direito)\\b';
const EIXO_RE=new RegExp('eixos?\\s*((?:[1-4]\\s*(?:,|e|\\/|\\+)?\\s*)+)\\s*((?:'+SIDE_RE+'\\s*(?:,|e|\\/|\\+)?\\s*)+)','gi');
const sideOf=t=>{ const sd=t.replace(/[\s.]/g,'').toLowerCase(); return (/direito/.test(sd)||sd==='ld')?'LD':'LE'; };
const sidesIn=t=>[...new Set((t.match(new RegExp(SIDE_RE,'gi'))||[]).map(sideOf))];
const MEC_RULES=[
  {re:/\bposte\b/i, seqs:['11','17'], nome:'Poste de retenção', falha:s=>`Poste de retenção danificado ${s}`.trim(), acao:'Troca do cabo de aço', pn:'242483-040.00', porLado:true},
  {re:/raspador.*transf|transf.*raspador/i, seqs:['21'], falha:()=>'Raspador da correia de transferência danificado', acao:'Troca do raspador da correia de transferência', pn:'241338'},
  {re:/raspador.*piso|piso.*raspador/i, seqs:['18'], falha:()=>'Raspador da correia de piso danificado', acao:'Troca do raspador da correia de piso', pn:'241920'},
  {re:/cabo\s+de\s+a[cç]o.*i[cç]amento|i[cç]amento.*cabo/i, seqs:['13'], falha:()=>'Cabo de aço do içamento da correia danificado', acao:'Troca do cabo de aço', pn:'242483-040.00'}
];
/* Anotações são sempre problemas. "ruim" pode vir ou não:
   "Poste de retenção LD" = "Poste de retenção LD ruim". Se só tiver "ruim" (ou nada),
   a falha fica "danificado/com defeito"; se tiver outra palavra (travado, avariado…), o "ruim" sai. */
const COND_RE=/\b(travad\w*|avariad\w*|danificad\w*|quebrad\w*|gast[oa]s?|trincad\w*|solt[oa]s?|faltando|ausentes?|vazando|vazamentos?|baix[oa]s?|empenad\w*|rasgad\w*|furad\w*|queimad\w*|n[ãa]o\s+funciona\w*|sem\s+funcionar|defeito|desgast\w*|ressecad\w*|suj[oa]s?|ruidos[oa]|barulh\w*|sem\s+\w+)\b/i;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function cleanTxt(s,fem){
  let t=String(s).replace(/\s+/g,' ').replace(/[.;]+$/,'').trim();
  const sem=t.replace(/\bruim\b/ig,'').replace(/\s+/g,' ').trim();
  if(COND_RE.test(sem)) return cap(sem);
  return cap(sem)+(fem?' danificada':' com defeito');
}
/* Roletes da correia de transferência: 4 de cada lado, contando de baixo (1) para cima (4).
   Entram no item "Inspecionar correia de transferência" (seq 10, rota desligada, diário). */
const ROLETE_SEQ='10';
/* Outros problemas comuns → item da folha. A falha é o próprio texto anotado. */
const FIX_RULES=[
  {re:/arrefec|l[ií]quido\s+do\s+radiador|[áa]gua\s+do\s+radiador/i, cat:'mec', seq:'6', sug:'arref'},
  {re:/hidr[áa]ul\w*.*(n[ií]vel|baix)|(n[ií]vel|baix).*hidr[áa]ul|tanque\s+hidr/i, cat:'hid', seq:'4', sug:'hidr'},
  {re:/[óo]leo/i, cat:'mec', seq:'5', sug:'oleo', only:/n[ií]vel|baix|complet|falt/i},
  {re:/filtro\s+de\s+ar/i, cat:'mec', seq:'8'},
  {re:/vaza\w*.*motor|motor.*vaza/i, cat:'mec', seq:'7'},
  {re:/correia\s+de\s+transfer/i, cat:'mec', seq:'10'},
  {re:/(correia|corrente)\s+(de|do)\s+piso/i, cat:'mec', seq:'12'},
  {re:/cilindro/i, cat:'hid', seq:'8'},
  {re:/(mangueira|tubula\w*|vaza\w*).*hidr|hidr\w*.*(mangueira|vaza)/i, cat:'hid', seq:'5'},
  {re:/(mangueira).*pneum|pneum\w*.*mangueira/i, cat:'pne', seq:'7'},
  {re:/vaza\w*.*(\bar\b|pneum)|pneum\w*.*vaza/i, cat:'pne', seq:'5'}
];
function pieces(t){
  const out=[]; [[t.texto,t.by],...(t.comments||[]).map(c=>[c.texto,c.by])].forEach(([tx,by])=>
    String(tx||'').split(/\n+/).forEach(l=>l.split(/[;,](?!\s*(?:[1-4]\b|l\.?\s?[ed]\b|lado))/i).map(x=>x.trim()).filter(Boolean).forEach(x=>out.push({txt:x,by}))));
  return out;
}
/* achados de uma dica: [{cat, cond, seq, falha, acao, mat, by}] + pedaços sem regra */
/* "ok", "boa", "nova"… = está bom: tira da lista de problemas.
   Ex.: "sapata eixo 1, 2, 3, 4 LD ruim / eixo 1, 3, 4 LE ruim / eixo 2 LE ok" → só a 2 LE fica boa.
   Também: "todas as sapatas ruins menos eixo 2 LE". */
const GOOD_RE=/\b(ok|boa|boas|bom|bons|nov[ao]s?|normal|em\s+ordem|sem\s+problemas?)\b/i;
const EXCEPT_RE=/\b(menos|exceto|tirando|fora|salvo|s[oó]\s+n[aã]o)\b/i;
function findings(t){
  const ps=pieces(t), found=[], rest=[];
  const shoe={'4':{LE:new Set(),LD:new Set()},'5':{LE:new Set(),LD:new Set()}}, poste=new Set(); let posteHit=false;
  const goodShoe=new Set(), goodPoste=new Set();
  const rol=[]; let rolN=0;
  const addShoe=(e,sd,good)=>{ if(good) goodShoe.add(e+sd); else shoe[+e<=2?'4':'5'][sd].add(+e); };
  ps.forEach(pc=>{
    let hit=false;
    const all=/\btod[ao]s\b/i.test(pc.txt)&&/sapata/i.test(pc.txt);
    if(all){ [1,2,3,4].forEach(e=>['LE','LD'].forEach(sd=>addShoe(e,sd,false))); hit=true; }
    const ex=pc.txt.search(EXCEPT_RE);
    for(const m of pc.txt.matchAll(EIXO_RE)){ const sides=sidesIn(m[2]);
      const good=(ex>=0&&m.index>ex)||(!all&&GOOD_RE.test(pc.txt));
      (m[1].match(/[1-4]/g)||[]).forEach(e=>sides.forEach(sd=>addShoe(e,sd,good))); hit=true; }
    if(hit) return;
    if(GOOD_RE.test(pc.txt)&&!COND_RE.test(pc.txt)&&!/\bruim\b/i.test(pc.txt)){ // algo dito como bom: não é problema
      if(/\bposte\b/i.test(pc.txt)) sidesIn(pc.txt).forEach(x=>goodPoste.add(x));
      return; }
    if(/rolete/i.test(pc.txt)){ const nums=(pc.txt.replace(/rolete[s]?/ig,' ').match(/\b[1-4]\b/g)||[]), sides=Math.max(1,sidesIn(pc.txt).length);
      rolN+=Math.max(1,nums.length)*sides; rol.push(cleanTxt(pc.txt,false).replace(/ com defeito$/,' danificado')); return; }
    const r=MEC_RULES.find(x=>x.re.test(pc.txt));
    if(r){ if(r.porLado){ posteHit=true; const sd=sidesIn(pc.txt); (sd.length?sd:['LE','LD']).forEach(x=>poste.add(x)); return; }
      r.seqs.forEach(sq=>found.push({cat:'mec',cond:DES,seq:sq,falha:r.falha(''),acao:r.acao,mat:partTxt(r.pn),by:pc.by})); return; }
    const m=pc.txt.match(/^(?:seq\.?|item)?\s*(\d{1,2})\s*(fs|tf)?\s*[-–:.)]\s*(.+)$/i);
    if(m){ found.push({cat:null,seq:m[1]+(m[2]?' '+m[2].toUpperCase():''),falha:m[3].trim(),by:pc.by}); return; }
    const fx=FIX_RULES.find(x=>x.re.test(pc.txt)&&(!x.only||x.only.test(pc.txt)));
    if(fx){ const s=fx.sug&&SUG[fx.sug]&&SUG[fx.sug][0];
      found.push({cat:fx.cat,cond:fx.cond==='LIG'?LIG:DES,seq:fx.seq,falha:s?s.f:cleanTxt(pc.txt,false),acao:s?s.a:'',mat:s?s.m:'',by:pc.by}); return; }
    rest.push(pc);
  });
  if(rol.length) found.push({cat:'mec',cond:DES,seq:ROLETE_SEQ,falha:rol.join('; '),acao:rolN>1?'Troca dos roletes da correia de transferência':'Troca do rolete da correia de transferência',
    mat:`241313 - Rolete da correia de transferência (${rolN} un)`});
  goodShoe.forEach(g=>{ const e=+g[0], sd=g.slice(1); shoe[e<=2?'4':'5'][sd].delete(e); });
  goodPoste.forEach(sd=>poste.delete(sd)); if(posteHit&&!poste.size) posteHit=false;
  for(const k of ['4','5']){ const parts=[]; let n=0;
    for(const sd of ['LE','LD']){ const ex=[...shoe[k][sd]].sort(); if(!ex.length) continue; n+=ex.length;
      parts.push(`eixo ${ex.length>1?ex.slice(0,-1).join(', ')+' e '+ex.at(-1):ex[0]} ${sd}`); }
    if(n) found.push({cat:'tru',cond:DES,seq:k,falha:`${n>1?'Sapatas':'Sapata'} ${parts.join(' e ')} ${n>1?'danificadas':'danificada'}`,
      acao:n>1?'Troca das sapatas de freio':'Troca da sapata de freio',mat:`A15741 - Sapata de freio (${n} un)`});
  }
  if(posteHit){ const sd=[...poste].sort((x,y)=>x==='LE'?-1:y==='LE'?1:0).join(' e '), r=MEC_RULES[0], q=Math.max(1,poste.size)*2;
    r.seqs.forEach(sq=>found.push({cat:'mec',cond:DES,seq:sq,falha:r.falha(sd),acao:r.acao,mat:`242483-040.00 - Cabo de aço MHC (${q} un)`})); }
  return {found,rest};
}
/* trechos para o modal Aplicar, no sistema da inspeção aberta */
function segments(t,cat){
  const {found,rest}=findings(t);
  const out=found.filter(f=>!f.cat||f.cat===cat).map(f=>({seq:f.seq,cond:f.cond,txt:f.falha,acao:f.acao,mat:f.mat,shoe:!!f.mat,by:f.by||''}));
  if(rest.length) out.push({seq:'',txt:rest.map(r=>r.txt).join(' · '),by:''});
  return out;
}
function suggestKey(items,seq,cond){
  if(!seq) return '';
  if(cond){ const k=items.find(i=>i.cond===cond&&i.seq.toUpperCase()===seq.toUpperCase()); if(k) return k.key; }
  const exact=items.filter(i=>i.seq.toUpperCase()===seq.toUpperCase());
  const pool=exact.length?exact:items.filter(i=>i.seq.split(' ')[0]===seq.split(' ')[0]);
  const lig=pool.find(i=>i.cond===LIG); // as anotações foram da rota ligada
  return (lig||pool[0]||{}).key||'';
}
function vNotes(insp){
  const ns=notesFor(insp.mhc); if(!ns.length) return '';
  const done=insp.applied||{};
  const open=!!V.notesOpen;
  return `<section class="card stack" style="gap:8px;border-left:6px solid var(--accent)">
    <button class="row" style="border:0;background:none;padding:0;justify-content:space-between;width:100%;font-weight:700" data-act="notesToggle">
      <span>📝 Anotações do MHC80-${h(insp.mhc)} (${ns.length})</span><span>${open?'▲':'▼'}</span></button>
    ${open?ns.map(t=>{ const sg=segments(t,insp.cat), n=(done[t.id]||[]).length;
      return `<div class="cm"><b>${h(t.titulo)}</b><span class="small muted">${h(t.by||'')}${n?` · <b style="color:var(--ok)">${n} de ${sg.length} aplicado${n>1?'s':''}</b>`:''}</span>
        ${sg.map(x=>`<div class="small">${x.seq?`<b>Seq ${h(x.seq)}:</b> `:''}${h(x.txt)}</div>`).join('')}
        <button class="btn alt" style="align-self:flex-start;min-height:38px;padding:6px 12px" data-act="applyOpen" data-id="${h(t.id)}">Aplicar no checklist</button></div>`; }).join(''):''}
  </section>`;
}
function vApply(){
  if(!V.apply) return '';
  const insp=curInsp(), t=NOTES.find(x=>x.id===V.apply); if(!insp||!t) return '';
  const items=scoped(insp), sg=segments(t,insp.cat), done=(insp.applied||{})[t.id]||[];
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="apT"><div class="card stack" style="max-height:88vh;overflow:auto">
    <h3 id="apT">Aplicar no checklist</h3>

/* ===================== PASSAR PARA A FOLHA =====================
   Uma folha por vez, na ordem do papel: cada sistema e, dentro dele, cada rota
   (motor desligado / ligado), e no fim o verso (registro de tráfego) do sistema.
   Tocar numa linha marca "passado" para saber onde parou. */
function paperDocs(mhc,day){
  const out=[];
  CATS.filter(c=>allowed(c.id)&&hasItems(c)).forEach(c=>{
    const insp=inspsFor(mhc,c.id).filter(i=>dayKey(i.inicio)===day)[0]; if(!insp) return;
    c.conds.forEach((cd,ci)=>out.push({kind:'route',insp,cat:c,ci,cond:cd.c}));
    out.push({kind:'reg',insp,cat:c});
  });
  return out;
}
function paperDays(mhc){ return [...new Set(inspsFor(mhc).map(i=>dayKey(i.inicio)))].sort().reverse(); }
const RES_TXT={ok:'( X ) OK',nok:'( X ) NÃO OK',na:'( X ) NÃO SE APLICA'};

  html+=`<div class="row" style="justify-content:space-between">
    <button class="btn ghost" data-act="ppGo" data-i="${ix-1}" ${ix<=0?'disabled':''}>‹ Folha anterior</button>

  return html;

        <textarea id="nt" data-note="${h(m)}" style="min-height:140px" placeholder="ex.:\nPoste de retenção LD ruim\nSapata eixo 3 LD e LE\nRolete 1 LD travado, rolete 4 LD avariado\nFluido de arrefecimento baixo">${h(noteGet(m))}</textarea></div>

        <section class="card stack" style="gap:8px" id="notePrev">${notePreview(m)}</section>`:`<span class="small muted">${minha?h(minha.length>90?minha.slice(0,90)+'…':minha):'Toque para anotar os problemas encontrados. No final eu pergunto se você quer passar tudo para o checklist.'}</span>`}
      <div id="noteAct">${V.qf?'':noteAct(m)}</div>
    </section>`;
  return topBar(`<b>MHC80-${h(m)}</b>`,true)+`<div class="stack">
    ${fora?`<div class="card small" style="border-left:6px solid var(--warn)"><b>Este MHC está fora da frota de hoje.</b> Dá para fazer o checklist mesmo assim.</div>`:''}
    ${paperDays(m).length?`<button class="btn full" data-act="paper" data-m="${h(m)}">📄 Passar para a folha (consulta sistema por sistema)</button>`:''}
    ${noteCats().length?notaBox:''}
    ${V.qf?vQuickResult(V.qf):''}
    ${tpl?`<div class="card small">Escolha o próximo checklist. Começa direto com o mesmo escopo (<b>${ESC[tpl.escopo]}</b>), local e mantenedores do anterior.</div>`:''}
    ${cards}
    <button class="btn ghost full" data-act="browse">Histórico por data</button></div>`;
}

function vCat(){
  const c=CAT[V.cat], list=inspsFor(V.mhc,V.cat);
  const aberta=list.find(i=>!i.fim);
  let html=topBar(`MHC80-${h(V.mhc)} · <b>${c.nome}</b>`,true)+'<div class="stack">';
  if(aberta && !draft) html+=cardInsp(aberta);
  if(draft){
    const d=draft;
    html+=`<section class="card stack">
      <h3>Nova inspeção · ${c.nome}</h3>
      ${(c.esc||[]).length===1?`<span class="small muted">Folha única: ${scoped({cat:V.cat,escopo:d.escopo}).length} itens, sem escolher escopo.</span>`:''}
      <div class="stack" style="gap:6px;${(c.esc||[]).length===1?'display:none':''}"><span class="small muted" style="font-weight:600">Escopo a ser executado</span>
        <div class="seg" role="group" aria-label="Escopo">${(c.esc||['D','S','M']).map(k=>`<button data-act="esc" data-v="${k}" class="${d.escopo===k?'on':''}">${ESC[k]}</button>`).join('')}</div>
        <span class="small muted">${d.escopo==='D'?'Só itens diários.':d.escopo==='S'?'Itens diários e semanais.':'Todos os itens (diários, semanais e mensais).'} ${scoped({cat:V.cat,escopo:d.escopo,rota:d.rota}).length} itens.</span></div>
      ${twoRoutes(V.cat)?`<div class="stack" style="gap:6px"><span class="small muted" style="font-weight:600">Começar por qual rota?</span>
        <div class="seg" role="group" aria-label="Rota"><button data-act="rota" data-v="des" class="${d.rota==='des'?'on':''}">Rota desligada</button><button data-act="rota" data-v="ligsel" class="${d.rota!=='des'?'on':''}">Rota ligada</button></div>
        ${d.rota!=='des'?`<span class="small" style="font-weight:700">A rota desligada já foi feita?</span>
        <div class="seg" role="group" aria-label="Rota desligada já feita"><button data-act="rota" data-v="lig" class="${d.rota==='lig'?'on':''}">Sim</button><button data-act="rota" data-v="ligdes" class="${d.rota==='ligdes'?'on':''}">Não</button></div>
        <span class="small muted">${d.rota==='lig'?'Só os itens da rota ligada entram nesta inspeção.':d.rota==='ligdes'?'Começa pela ligada. A rota desligada fica em aberto para fazer depois.':'Escolha Sim ou Não.'}</span>`:`<span class="small muted">Fluxo normal: rota desligada e depois a ligada.</span>`}</div>`:''}
      <div class="row"><div class="fld"><label for="d-of">Oficina</label><input id="d-of" data-d="oficina" value="${h(d.oficina)}" placeholder="GIU"></div>
        <div class="fld"><label for="d-pa">Pátio</label><input id="d-pa" data-d="patio" value="${h(d.patio)}" placeholder="P2114"></div></div>
      ${d.mant.map((m,ix)=>`<div class="row"><div class="fld" style="flex:2"><label for="m${ix}n">Mantenedor ${ix+1}${ix?' (opcional)':''}</label><input id="m${ix}n" data-m="${ix}" data-k="nome" value="${h(m.nome)}"></div>
        <div class="fld"><label for="m${ix}m">Matrícula</label><input id="m${ix}m" inputmode="numeric" data-m="${ix}" data-k="mat" value="${h(m.mat)}"></div>
        <div class="fld"><label for="m${ix}t">Turma</label><input id="m${ix}t" data-m="${ix}" data-k="turma" value="${h(m.turma)}"></div></div>`).join('')}
      <div class="row"><button class="btn y" data-act="start">Começar checklist</button><button class="btn ghost" data-act="cancelDraft">Cancelar</button></div>
    </section>`;
  } else {
    html+=`<button class="btn ${aberta?'alt':'y'} full" data-act="newDraft">Nova inspeção</button>`;
  }
  const hist=list.filter(i=>i!==aberta);
  if(hist.length){
    html+='<h3>Histórico</h3>'+hist.map(i=>{ const st=stats(i);
      return `<div class="card row" style="justify-content:space-between">
        <div><b>${fmt(i.inicio)}</b> <span class="small muted">· ${ESC[i.escopo]}</span><div class="small muted">${st.ok} Ok · ${st.nok} Não Ok · ${st.na} N/A${i.fim?'':' · não finalizada'}${st.falta?' · <b style="color:var(--warn)">registro pendente</b>':''}</div></div>
        <div class="row"><button class="btn alt" data-act="sheet" data-id="${i.id}">Folha</button><button class="btn ghost" data-act="askDel" data-id="${i.id}" aria-label="Apagar">Apagar</button></div></div>`; }).join('');
  }
  return html+'</div>';
}

function vWiz(){
  const insp=S.insps[V.id]; if(!insp){ V={v:'home'}; return vHome(); }
  const items=scoped(insp), st=stats(insp), c=CAT[insp.cat];
  const ttl=`MHC80-${h(insp.mhc)} · <b>${c.nome}</b>`;
  if(V.pos>=items.length) return vSummary(insp,items,st,ttl);
  const it=items[V.pos], a=insp.ans[it.key]||{};
  if(insp.rota==='ligdes' && it.cond===DES && V.pos>0 && items[V.pos-1].cond===LIG && !V.gate)
    return topBar(ttl,true)+`<div class="stack">
     <div class="cond lig">Rota ligada concluída</div>
     <div class="card stack"><h3>Fazer a rota desligada agora?</h3>
       <p style="margin:0">Faltam ${items.length-V.pos} itens da rota desligada. Se deixar para depois, esta inspeção fica <b>em aberto</b> e você continua de onde parou.</p>
       <button class="btn y full" data-act="gateGo">Fazer a rota desligada agora</button>
       <button class="btn ghost full" data-act="gateLater">Deixar em aberto</button></div></div>`;
  const lig=it.cond===LIG;
  let html=topBar(ttl,true)+`<div class="stack">
   ${V.editOne?`<div class="card small" style="border-left:6px solid var(--accent)"><b>Editando um item do checklist finalizado.</b> Escolha a resposta certa; depois você volta para a folha.</div>`:`<div class="prog"><span>${V.pos+1} de ${items.length}</span>${bar(st)}</div>`}
   ${vNotes(insp)}
   <div class="cond ${lig?'lig':''}">${lig?'⚠ ':''}${h(it.cond)}</div>
   <article class="task">
     <div class="hd"><div class="sq">${h(it.seq)}</div><div><div class="meta">${h(it.sis)} · ${h(it.sub)}</div><div class="atv">${h(it.atv)}</div></div></div>
     ${it.tag?`<div class="bd" style="padding-bottom:0"><div class="tagw">⚠ ${h(it.tag)}</div></div>`:''}
     <div class="bd"><span class="lbl">Resultado esperado</span><div>${h(it.esp)}</div>
     ${(c.esc||[]).length>1?`<div class="row small muted" style="margin-top:4px"><span class="pill p-na">${ESC[it.esc]}</span></div>`:''}</div>
   </article>
   <div class="answers" role="group" aria-label="Resultado encontrado">
     ${['ok','nok','na'].map(r=>`<button class="ans ${r} ${a.r===r?'sel':''}" data-act="ans" data-r="${r}"><span class="bx">${a.r===r?'✕':''}</span>${RLBL[r]}</button>`).join('')}
   </div>`;
  if(a.r==='nok') html+=`<p class="small" style="margin:0;color:var(--nok);font-weight:600">Marcado como Não Ok. A falha você descreve no registro de tráfego, no final.</p>`;
  if(V.editOne) return html+'</div>';
  html+=`</div><nav class="nav"><div class="in">
    <button class="btn ghost" data-act="prev" ${V.pos===0?'disabled':''}>‹ Anterior</button>
    <button class="btn ghost" data-act="sheet" data-id="${insp.id}">Folha</button>
    <button class="btn ghost" data-act="next">Pular ›</button></div></nav>`;
  return html;
}

function vSummary(insp,items,st,ttl){
  const falt=items.map((it,ix)=>({it,ix,a:insp.ans[it.key]})).filter(o=>!o.a||!o.a.r);
  const nokSem=items.map((it,ix)=>({it,ix,a:insp.ans[it.key]})).filter(o=>o.a&&o.a.r==='nok'&&!(o.a.falha||'').trim());
  return topBar(ttl,true)+`<div class="stack">
    <h2>${insp.fim?'Inspeção finalizada':'Fim do checklist'}</h2>
    <div class="tally"><div><b>${st.ok}</b><span>Ok</span></div><div><b style="color:var(--nok)">${st.nok}</b><span>Não Ok</span></div><div><b>${st.na}</b><span>N/A</span></div><div><b style="color:var(--warn)">${falt.length}</b><span>Sem resposta</span></div></div>
    ${falt.length?`<div class="card stack" style="gap:8px"><b>Itens sem resposta</b>${falt.map(o=>`<button class="btn ghost" style="text-align:left" data-act="goto" data-p="${o.ix}">Seq ${h(o.it.seq)} · ${h(o.it.atv)}</button>`).join('')}</div>`:''}
    ${st.nok?`<div class="card stack" style="gap:8px;border-left:6px solid var(--nok)"><b>Registro de solicitações de tráfego</b><span class="small muted">${st.nok} item(ns) Não Ok: Seq ${items.filter(i=>(insp.ans[i.key]||{}).r==='nok').map(i=>h(i.seq)).join(', ')}. ${nokSem.length?nokSem.length+' ainda sem falha descrita. Pode preencher agora ou depois.':'Tudo preenchido.'}</span><button class="btn y full" data-act="reg" data-id="${insp.id}">Preencher registro de tráfego</button></div>`:''}
    ${insp.fim?`<p class="muted">Fim registrado: ${fmt(insp.fim)}</p>`:`<button class="btn y full" data-act="finish">Finalizar inspeção (registra hora do fim)</button>`}
    <button class="btn alt full" data-act="sheet" data-id="${insp.id}">Ver folha para passar no papel</button>
    <button class="btn full" data-act="others" data-id="${insp.id}">Abrir os outros checklists do MHC80-${h(insp.mhc)}</button>
  </div>`;
}

function vReg(){
  const insp=S.insps[V.id]; if(!insp){ V={v:'home'}; return vHome(); }
  const c=CAT[insp.cat], reg=scoped(insp).filter(i=>(insp.ans[i.key]||{}).r==='nok'&&(!V.only||i.key===V.only));
  window.__sugR={};
  let html=topBar(`${V.only?'Solicitação de tráfego':'Registro de tráfego'} · <b>MHC80-${h(insp.mhc)}</b>`,true)+`<div class="stack">
   <p class="muted" style="margin:0">${V.only?'Pré-preenchimento para não esquecer. Dá para completar depois no final do checklist.':c.nome+' · '+fmt(insp.inicio)+'. Tudo salva sozinho enquanto você digita. Pode sair e voltar depois.'}</p>`;
  if(!reg.length) html+=`<p>Nenhum item Não Ok nesta inspeção.</p>`;
  reg.forEach(i=>{ const a=insp.ans[i.key]; const sg=learned(insp,i); window.__sugR[i.key]=sg; const k=i.key;
    html+=`<section class="card stack regcard" style="gap:10px">
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="sq">${h(i.seq)}</span><div><div class="sub">${h(i.cond)} · ${h(i.sub)}</div><div style="font-weight:600">${h(i.atv)}</div></div></div>
      ${i.tag?`<div class="tagw">⚠ ${h(i.tag)}</div>`:''}
      ${sg.length?`<div class="sug"><span class="small muted">Toque para preencher</span>${sg.map((s,ix)=>`<button data-act="sugR" data-k="${k}" data-i="${ix}"><b>${h(s.f)}</b>${h(s.a)}${s.m?' · '+h(s.m):''}</button>`).join('')}</div>`:''}
      <div class="fld"><label for="f${k}a">Falha encontrada</label><textarea id="f${k}a" data-rk="${k}" data-f="falha">${h(a.falha)}</textarea></div>
      <div class="fld"><label for="f${k}b">Ação corretiva (solução ou tentativa)</label><textarea id="f${k}b" data-rk="${k}" data-f="acao">${h(a.acao)}</textarea></div>
      ${(()=>{ const pl=partsFor(insp.cat,i).list; const all=V.allParts===k;
        const chip=pn=>`<button class="chip" style="text-align:left" data-act="addPart" data-k="${k}" data-pn="${h(pn)}"><b>${h(pn)}</b> · ${h(PART[pn].nome)}${PART[pn].qtd?` (${PART[pn].qtd} un)`:''}</button>`;
        return `<div class="stack" style="gap:6px"><span class="small muted" style="font-weight:600">${pl.length?'Peça sugerida para este item (toque para pôr no material)':'Peças (toque para pôr no material)'}</span>
          <div class="chips">${pl.map(chip).join('')}<button class="chip" data-act="allParts" data-k="${k}">${all?'Fechar lista':'Todas as peças'}</button></div>
          ${all?`<div class="chips">${PARTS.filter(p=>!pl.includes(p.pn)).map(p=>chip(p.pn)).join('')}</div>`:''}</div>`; })()}
      <div class="row"><div class="fld" style="flex:2"><label for="f${k}c">Material</label><input id="f${k}c" data-rk="${k}" data-f="mat" value="${h(a.mat)}"></div>
      <div class="fld"><label for="f${k}d">Nº OS / Ocorrência</label><input id="f${k}d" data-rk="${k}" data-f="os" value="${h(a.os)}"></div></div>
      <label class="chk"><input type="checkbox" data-rk="${k}" data-f="corr" ${a.corr?'checked':''}> Corrigido na hora</label>
    </section>`; });
  html+= V.only? `<button class="btn y full" data-act="regBack">Salvar e voltar ao checklist</button></div>`
    : `<button class="btn alt full" data-act="sheet" data-id="${insp.id}">Ver folha completa</button></div>`;
  return html;
}

function rbox(r){ return `<div class="rbox">${['ok','nok','na'].map(k=>`<span class="${r===k?'x '+k:''}">(${r===k?'X':'&nbsp;&nbsp;'}) ${k==='na'?'N/A':RLBL[k]}</span>`).join('')}</div>`; }

function vSheet(){
  const insp=curInsp(); if(!insp){ V={v:'home'}; return vHome(); }
  const ro=!!V.ro;
  const c=CAT[insp.cat], all=itemsOf(insp), st=stats(insp), sc=scoped(insp);
  const mant=(insp.mant||[]).filter(m=>m.nome||m.mat);
  let html=topBar(`Folha · MHC80-${h(insp.mhc)} · <b>${c.nome}</b>`,true)+`<div class="stack">
   <section class="card hdrgrid">
     <div><span>Local</span><b>Oficina: ${h(insp.oficina)||'—'}</b><br><b>Pátio: ${h(insp.patio)||'—'}</b></div>
     <div><span>Equipamento</span><b>MHC80: ${h(insp.mhc)}</b></div>
     <div><span>Início</span><b>${fmtD(insp.inicio)} às ${fmtH(insp.inicio)}</b></div>
     <div><span>Fim</span><b>${insp.fim?fmtD(insp.fim)+' às '+fmtH(insp.fim):'em andamento'}</b></div>
     <div><span>Escopo a ser executado</span><b>(X) ${ESC[insp.escopo]}</b></div>
     ${insp.rota&&insp.rota!=='des'?`<div style="grid-column:1/-1"><span>Rota</span><b>${ROTA_TXT[insp.rota]}</b></div>`:''}
     <div><span>Visita · Duração</span><b>N/A · Não medido</b></div>
     ${ro?`<div style="grid-column:1/-1"><span>Enviado por</span><b>${h(insp.by)||'—'}</b></div>`:''}
     <div style="grid-column:1/-1"><span>Banco de assinaturas · Mantenedores</span>${mant.length?mant.map(m=>`<b>${h(m.nome)} / ${h(m.mat)} / ${h(m.turma)}</b>`).join('<br>'):'<b>—</b>'}</div>
   </section>
   <div class="tally"><div><b>${st.ok}</b><span>Ok</span></div><div><b style="color:var(--nok)">${st.nok}</b><span>Não Ok</span></div><div><b>${st.na}</b><span>N/A</span></div><div><b style="color:var(--warn)">${st.tot-st.done}</b><span>Sem resposta</span></div></div>
   ${ro?'':vNotes(insp)}
   <p class="small muted" style="margin:0">${ro?'Somente leitura: checklist de outra pessoa.':''+(insp.fim?'Checklist finalizado: toque numa linha para editar a resposta.':'Toque numa linha para corrigir a resposta.')+(insp.editado?' Editado em '+fmt(insp.editado)+'.':'')}</p>`;
  c.conds.forEach((cd,ci)=>{
    const rows=all.filter(i=>i.ci===ci);
    html+=`<h3>Condição: ${h(cd.c)}</h3><div class="tblwrap"><table><thead><tr><th>Seq</th><th>Atividade</th><th>Resultado encontrado</th><th>Esc.</th></tr></thead><tbody>`+
      rows.map(i=>{ const a=insp.ans[i.key]||{}; const pos=sc.findIndex(x=>x.key===i.key);
        if(!i.inScope) return `<tr class="out"><td class="seq">${h(i.seq)}</td><td><div class="sub">${h(i.sub)}</div>${h(i.atv)}</td><td class="small">${i.rotaOut?'rota feita em outra inspeção':'fora do escopo'}</td><td class="esc">${i.esc}</td></tr>`;
        return `<tr ${ro?'':`class="click" data-act="goto" data-p="${pos}"`}><td class="seq">${h(i.seq)}</td><td><div class="sub">${h(i.sub)}</div>${h(i.atv)}${a.r==='nok'&&!(a.falha||'').trim()?'<div class="pend">Falta descrever a falha</div>':''}</td><td>${a.r?rbox(a.r):'<span class="pend">Sem resposta</span>'}</td><td class="esc">${i.esc}</td></tr>`;
      }).join('')+`</tbody></table></div>`;
  });
  const reg=sc.filter(i=>(insp.ans[i.key]||{}).r==='nok');
  html+=`<h3>Registro de solicitações de tráfego (atividades corretivas)</h3>`+(reg.length&&!ro?`<button class="btn y" data-act="reg" data-id="${insp.id}">Preencher / editar registro</button>`:'');
  if(!reg.length) html+=`<p class="muted" style="margin:0">Nenhum Não Ok. Nada para registrar no verso.</p>`;
  else html+=`<div class="tblwrap"><table class="reg"><thead><tr><th>Seq</th><th>Falha encontrada</th><th>Ação corretiva</th><th>Material</th><th>Nº OS</th><th>Passei</th></tr></thead><tbody>`+
    reg.map(i=>{ const a=insp.ans[i.key]; const cp=(insp.cp||{})[i.key];
      return `<tr class="${cp?'done':''}"><td class="seq">${h(i.seq)}</td><td>${h(a.falha)||'<span class="pend">preencher</span>'}${a.corr?'<div class="small" style="color:var(--ok);font-weight:700">(X) Corrigido</div>':''}</td><td>${h(a.acao)}</td><td>${h(a.mat)}</td><td>${h(a.os)}</td>
 <td><button class="tick ${cp?'on':''}" ${ro?'disabled':''} data-act="cp" data-k="${i.key}" aria-label="Marcar como passado para a folha">${cp?'✓':''}</button></td></tr>`; }).join('')+`</tbody></table></div>`;
  html+=`<div class="row"><button class="btn y" data-act="copy">Copiar resumo em texto</button>${insp.fim||ro?'':`<button class="btn alt" data-act="wiz" data-id="${insp.id}">Continuar checklist</button>`}${ro?'':`<button class="btn" data-act="others" data-id="${insp.id}">Outros checklists do MHC80-${h(insp.mhc)}</button>`}</div>
   <button class="btn danger full" data-act="${ro?'askDelR':'askDel'}" data-id="${h(insp.id)}">${ro?'Apagar este checklist da equipe':'Apagar este checklist'}</button>
   ${V.copyText?`<textarea class="copy" readonly id="copyTxt">${h(V.copyText)}</textarea>`:''}
  </div>`;
  return html;
}

function vAsk(){
  if(V.v!=='wiz'||!V.ask) return '';
  const insp=curInsp(); const it=insp&&scoped(insp).find(i=>i.key===V.ask); if(!it) return '';
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="askT"><div class="card stack">
   <span class="pill p-nok" style="align-self:flex-start">Seq ${h(it.seq)} · Não Ok</span>
   <h3 id="askT">Deseja comentar a falha agora?</h3>
   <p class="small muted" style="margin:0">${h(it.atv)}</p>
   <button class="btn danger full" data-act="askYes">Sim, comentar a falha</button>
   <button class="btn ghost full" data-act="askNo">Não, seguir o checklist</button></div></div>`;
}
function entries(){
  if(V.src==='team') return (TEAM.list||[]).map(x=>Object.assign({},x));
  return Object.values(S.insps).map(i=>{ const st=stats(i); return {own:true,id:i.id,n:'',m:i.mhc,c:i.cat,e:i.escopo,i:i.inicio,f:i.fim,ok:st.ok,nok:st.nok,na:st.na,tot:st.tot,falta:st.falta}; });
}
function groupBy(arr,fn){ const g=new Map(); arr.forEach(x=>{ const k=fn(x); if(!g.has(k)) g.set(k,[]); g.get(k).push(x); }); return g; }
function vBrowse(){
  const team=V.src==='team';
  const crumbs=[team?(V.p||'Equipe'):'Meus checklists', V.d&&dayLabel(V.d), V.m&&'MHC80-'+V.m].filter(Boolean).join(' › ');
  let html=topBar(team?'Checklists da <b>equipe</b>':'Histórico por <b>data</b>',true)+'<div class="stack">';
  html+=`<div class="row" style="justify-content:space-between"><span class="small muted">${h(crumbs)}</span>${team?'<span class="small muted">● ao vivo · atualiza a cada 8 s</span>':''}</div>`;
  if(team&&TEAM.err) return html+`<div class="card">${h(TEAM.err)}</div></div>`;
  if(team&&!TEAM.list) return html+'<p class="muted">Carregando…</p></div>';
  let list=entries();
  if(!list.length) return html+`<p class="muted">${team?'Ninguém enviou checklist ainda.':'Nenhum checklist ainda.'}</p></div>`;
  const pill=x=>x.f?(x.nok?`<span class="pill p-nok">${x.nok} Não Ok</span>`:'<span class="pill p-ok">Concluída</span>'):`<span class="pill p-open">${(x.ok||0)+(x.nok||0)+(x.na||0)}/${x.tot||0}</span>`;
  // 1) pessoas (só admin)
  if(team&&!V.p){
    const g=groupBy(list,x=>x.n||'Sem nome');
    [...g.keys()].sort((a,b)=>a.localeCompare(b,'pt')).forEach(n=>{ const xs=g.get(n), last=Math.max(...xs.map(x=>x.i||0));
      html+=`<button class="catcard" data-act="bP" data-v="${h(n)}"><div class="row" style="justify-content:space-between;width:100%"><span class="nm">${h(n)}</span><span class="small muted">${xs.length} checklist${xs.length>1?'s':''}</span></div><span class="small muted">Último: ${fmt(last)}</span></button>`; });
    return html+'</div>';
  }
  if(team) list=list.filter(x=>(x.n||'Sem nome')===V.p);
  // 2) datas
  if(!V.d){
    const g=groupBy(list,x=>dayKey(x.i));
    [...g.keys()].sort().reverse().forEach(k=>{ const xs=g.get(k), ms=[...new Set(xs.map(x=>x.m))].sort(), nok=xs.reduce((s,x)=>s+(x.nok||0),0);
      html+=`<button class="catcard" data-act="bD" data-v="${k}"><div class="row" style="justify-content:space-between;width:100%"><span class="nm">${dayLabel(k)}</span>${nok?`<span class="pill p-nok">${nok} Não Ok</span>`:''}</div><span class="small muted">${xs.length} checklist${xs.length>1?'s':''} · MHC80: ${ms.map(h).join(', ')}</span></button>`; });
    return html+'</div>';
  }
  list=list.filter(x=>dayKey(x.i)===V.d);
  // 3) MHCs do dia
  if(!V.m){
    const g=groupBy(list,x=>x.m);
    [...g.keys()].sort().forEach(m=>{ const xs=g.get(m);
      html+=`<button class="catcard" data-act="bM" data-v="${h(m)}"><span class="nm">MHC80-${h(m)}</span><span class="small muted">${xs.map(x=>(CAT[x.c]||{}).nome||x.c).join(' · ')}</span></button>`; });
    return html+'</div>';
  }
  // 4) checklists (sistemas) daquele MHC no dia
  list.filter(x=>x.m===V.m).sort((a,b)=>a.i-b.i).forEach(x=>{
    html+=`<button class="catcard" ${x.own?`data-act="sheetB" data-id="${x.id}"`:`data-act="openR" data-code="${h(x.code)}" data-id="${h(x.id)}"`}>
      <div class="row" style="justify-content:space-between;width:100%"><span class="nm">${h((CAT[x.c]||{}).nome||x.c)}</span>${pill(x)}</div>
      <span class="small muted">${ESC[x.e]||''} · início ${fmtH(x.i)}${x.f?' · fim '+fmtH(x.f):' · em andamento'}${x.falta?' · registro pendente':''}</span></button>`; });
  return html+'</div>';
}

function textOf(insp){
  const c=CAT[insp.cat], L=[];
  L.push(`CHECKLIST MHC80-${insp.mhc} · ${c.doc} · ${ESC[insp.escopo].toUpperCase()}`);
  L.push(`Início ${fmt(insp.inicio)} · Fim ${insp.fim?fmt(insp.fim):'—'}`);
  L.push(`Oficina: ${insp.oficina||'—'} · Pátio: ${insp.patio||'—'}`);
  (insp.mant||[]).filter(m=>m.nome).forEach(m=>L.push(`Mantenedor: ${m.nome} / ${m.mat} / ${m.turma}`));
  c.conds.forEach((cd,ci)=>{ L.push(''); L.push(`— ${cd.c.toUpperCase()} —`);
    itemsOf(insp).filter(i=>i.ci===ci&&i.inScope).forEach(i=>{ const a=insp.ans[i.key]||{}; L.push(`${i.seq}. ${a.r?RLBL[a.r]:'(sem resposta)'} – ${i.sub}`); }); });
  const reg=scoped(insp).filter(i=>(insp.ans[i.key]||{}).r==='nok');
  if(reg.length){ L.push(''); L.push('— REGISTRO DE SOLICITAÇÕES DE TRÁFEGO —');
    reg.forEach(i=>{ const a=insp.ans[i.key]; L.push(`Seq ${i.seq}: ${a.falha||'?'} | Ação: ${a.acao||'-'} | Material: ${a.mat||'-'}${a.os?' | OS '+a.os:''}${a.corr?' | Corrigido':''}`); }); }
  return L.join('\n');
}

/* ===================== RENDER ===================== */
let pendingRender=false;
function render(){
  pendingRender=false;
  let html='';
  switch(V.v){
    case 'mhc': html=vMhc(); break;
    case 'cat': html=vCat(); break;
    case 'wiz': html=vWiz(); break;
    case 'sheet': html=vSheet(); break;
    case 'reg': html=vReg(); break;
    case 'browse': html=vBrowse(); break;
    case 'notes': html=vNotes(); break;
    case 'paper': html=vPaper(); break;
    default: html=vHome();
  }
  $app.innerHTML=html+vConfirm()+vAsk()+vEditAsk()+vApply()+vQfAsk();
  if(V.v==='wiz'||V.v==='mhc'||(V.v==='sheet'&&!V.ro)) loadNotes();
}
function softRender(){
  const ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(pendingRender) softRender(); },50); });
function go(v){ V=v; render(); window.scrollTo(0,0); }

function back(){

  if(V.v==='mhc') go({v:'home'});

  else if(V.back) go(V.back);
  else if(V.v==='browse'){ const n=Object.assign({},V); if(n.m) delete n.m; else if(n.d) delete n.d; else if(n.p) delete n.p; else return go(n.src==='own'&&n.fromMhc?{v:'mhc',mhc:n.fromMhc}:{v:'home'}); go(n); }
  else if(V.v==='reg'&&V.only) go({v:'wiz',id:V.id,pos:V.ret});
  else if(V.v==='wiz'||V.v==='sheet'||V.v==='reg'){ const i=curInsp(); go(i?{v:'cat',mhc:i.mhc,cat:i.cat}:{v:'home'}); }
  else go({v:'home'});
}

    const insp=curInsp(), a=insp.ans[b.dataset.k]; if(!a) return;

    const y=window.scrollY; render(); window.scrollTo(0,y); return;
  }
  if(act==='goto'){ const id=V.id, i=S.insps[id];

document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='mhcIn') goMhc(); });
let noteT;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.note){ noteSet(t.dataset.note,t.value); clearTimeout(noteT); noteT=setTimeout(()=>{ const el=document.getElementById('notePrev'); if(el) el.innerHTML=notePreview(t.dataset.note); const ac=document.getElementById('noteAct'); if(ac&&!V.qf) ac.innerHTML=noteAct(t.dataset.note); },400); return; }
  if(t.dataset.f && V.v==='wiz'){
    const insp=curInsp(), it=scoped(insp)[V.pos], a=insp.ans[it.key]; if(!a) return;
    a[t.dataset.f]= t.type==='checkbox'? t.checked : t.value; touch(insp); return;
  }
  if(t.dataset.rk && V.v==='reg'){
    const insp=curInsp(), a=insp.ans[t.dataset.rk]; if(!a) return;
    a[t.dataset.f]= t.type==='checkbox'? t.checked : t.value; touch(insp); return;
  }
  if(draft && t.dataset.d){ draft[t.dataset.d]=t.value; return; }
  if(draft && t.dataset.m!==undefined){ draft.mant[+t.dataset.m][t.dataset.k]=t.value; return; }
});
document.addEventListener('change',e=>{ const t=e.target;
  if(t.id==='impFile' && t.files && t.files[0]){
    t.files[0].text().then(txt=>{ const d=JSON.parse(txt); if(!d||d.app!=='checklist-mhc80'||!d.insps) throw 0;
      let n=0; Object.values(d.insps).forEach(r=>{ const l=S.insps[r.id]; if(!l||(r.upd||0)>(l.upd||0)){ S.insps[r.id]=r; n++; } });
      if(d.prof && (d.prof.upd||0)>(S.prof.upd||0)) S.prof=d.prof;
      saveLocal(); render(); toast(n+' inspeção(ões) restaurada(s)'); }).catch(()=>toast('Arquivo inválido. Escolha uma cópia salva por este app.'));
    t.value=''; return;
  } if(t.type==='checkbox'&&t.dataset.f&&V.v==='wiz'){ const insp=curInsp(), it=scoped(insp)[V.pos], a=insp.ans[it.key]; if(a){ a[t.dataset.f]=t.checked; touch(insp);} } });

/* ===================== START ===================== */
loadLocal();
if(location.hash==='#equipe'&&AUTH.admin){ V={v:'browse',src:'team'}; render(); loadTeam(); } else render();
initCloud();
</script>
</body>
</html>
