<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e2126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manuais">
<title>Manuais</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============ ABERTURA ============ -->
<div id="splash" role="status" aria-live="polite" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#16181c;color:#eceef1;text-align:center;padding:24px;transition:opacity .4s ease">
  <img src="icons/icon-192.png" alt="" width="96" height="96" style="border-radius:22px">
  <div style="font-size:22px;font-weight:700">Manuais da Manutenção</div>
  <div style="font-size:15px;color:#9aa1ad">Criado por <b style="color:#f59e0b">Anderson Solidade</b> dev.</div>
</div>
<script>
  // Abertura: mostra o crédito por 1,8 s e some
  setTimeout(function () {
    var s = document.getElementById('splash'); if (!s) return;
    s.style.opacity = '0'; s.style.pointerEvents = 'none';
    setTimeout(function () { s.remove(); }, 450);
  }, 1800);
</script>

<!-- ============ TELA INICIAL ============ -->
<section id="home" class="screen active">
  <header class="topbar">
    <h1>Manuais</h1>
    <button id="btnPick" class="btn-ghost" aria-label="Escolher manuais">📥</button>
    <button id="btnSync" class="btn-ghost" aria-label="Atualizar manuais">⟳</button>
    <button id="btnAdmin" class="btn-accent" hidden>Painel</button>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>
  </header>
  <nav id="brands" class="brands" hidden></nav>
  <div class="searchbox">
    <span class="icon">🔍</span>
    <input id="search" type="search" placeholder="Buscar em todos os manuais…" autocomplete="off" enterkeyhint="search">
    <button id="searchClear" class="clear" hidden aria-label="Limpar">✕</button>
  </div>
  <nav id="chips" class="chips"></nav>
  <div id="syncBar" class="syncbar" hidden><div id="syncText"></div><div class="bar"><i id="syncFill"></i></div></div>
  <div id="homeBody" class="body"></div>
</section>

<!-- ============ CÓDIGO DE ACESSO ============ -->
<section id="login" class="screen">
  <div class="login-box">
    <img src="icons/icon-192.png" alt="" width="84" height="84">
    <h1>Manuais da Manutenção</h1>
    <p id="loginMsg" class="muted">Digite o código de acesso que você recebeu.</p>
    <div class="pwbox"><input id="loginCode" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AND-SL-XXXXXX" enterkeyhint="go"><button id="eyeBtn" class="eye" type="button" aria-label="Mostrar código">👁</button></div>
    <button id="pasteBtn" class="btn-ghost big-ghost">📋 Colar código</button>
    <button id="loginBtn" class="btn-accent big">Entrar</button>
    <p id="loginErr" class="err" hidden></p>
    <p class="muted small">O código é pessoal. Não repasse para outras pessoas.</p>
  </div>
</section>

<!-- ============ CONVERSÃO ============ -->
<section id="conv" class="screen">
  <header class="topbar"><h1>Conversão</h1></header>
  <div id="convBody" class="body"></div>
</section>

<!-- ============ CHECKLIST ============ -->
<section id="check" class="screen">
  <header class="topbar"><h1>Checklist</h1></header>
  <div id="checkBody" class="body"></div>
</section>
<section id="checkrun" class="screen">
  <header class="topbar">
    <button class="back" data-back aria-label="Voltar">‹</button>
    <div class="vtitle" style="flex:1;min-width:0"><div id="crTitle" class="title"></div><div id="crSub" class="sub muted small"></div></div>
  </header>
  <div id="crBody" class="body" style="padding-bottom:100px"></div>
  <div class="pickbar"><div id="crSum" class="muted small"></div><button id="crDone" class="btn-accent big">Ver resumo para a folha</button></div>
</section>

<!-- ============ ESCOLHER MANUAIS ============ -->
<section id="pick" class="screen">
  <header class="topbar">
    <button class="back" data-back aria-label="Voltar">‹</button>
    <h2 class="title">Escolher manuais</h2>
  </header>
  <div id="pickBody" class="body" style="padding-bottom:110px"></div>
  <div class="pickbar">
    <div id="pickSum" class="muted small"></div>
    <button id="pickSave" class="btn-accent big">Salvar e baixar</button>
  </div>
</section>

<!-- ============ PAINEL DO ADMINISTRADOR ============ -->
<section id="admin" class="screen">
  <header class="topbar">
    <button class="back" data-back aria-label="Voltar">‹</button>
    <h2 class="title">Painel do administrador</h2>
  </header>
  <div id="adminBody" class="body"></div>
</section>

<!-- ============ SUMÁRIO DO MANUAL ============ -->
<section id="manual" class="screen">
  <header class="topbar">
    <button class="back" data-back aria-label="Voltar">‹</button>
    <h2 id="manualTitle" class="title"></h2>
    <button id="btnOpenPdf" class="btn-ghost">Abrir</button>
  </header>
  <div class="searchbox">
    <span class="icon">🔍</span>
    <input id="manualSearch" type="search" placeholder="Buscar neste manual…" autocomplete="off" enterkeyhint="search">
    <button id="manualSearchClear" class="clear" hidden aria-label="Limpar">✕</button>
  </div>
  <div id="manualBody" class="body"></div>
</section>

<!-- ============ LEITOR ============ -->
<section id="viewer" class="screen">
  <header class="topbar viewer-bar">
    <button class="back" data-back aria-label="Voltar">‹</button>
    <div class="vtitle">
      <div id="viewerTitle" class="title"></div>
      <div id="viewerPage" class="sub"></div>
    </div>
    <button id="btnMark" class="btn-ghost" aria-label="Salvar página">☆</button>
  </header>
  <div id="hitBar" class="hitbar" hidden>
    <span id="hitText"></span>
    <button id="hitPrev">▲</button><button id="hitNext">▼</button><button id="hitClose">✕</button>
  </div>
  <div id="pages" class="pages"><div id="pagesInner" class="pages-inner"></div></div>
  <div class="zoombar">
    <button id="zoomOut">－</button>
    <button id="zoomFit">Ajustar</button>
    <button id="zoomIn">＋</button>
    <button id="goPage">Pág.</button>
  </div>
</section>

<!-- ============ ABAS ============ -->
<nav id="tabs" class="tabs" hidden>
  <button data-tab="home"><span>📚</span>Manuais</button>
  <button data-tab="conv"><span>📏</span>Conversão</button>
  <button data-tab="check"><span>✅</span>Checklist</button>
  <button data-tab="dicas" hidden><span>💡</span>Dicas</button>
</nav>

<!-- ============ DIÁLOGOS ============ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" id="sheetCard"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
